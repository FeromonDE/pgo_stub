name: Build PlayGo 0.6 (manual)

# Build only when explicitly started from Actions > Run workflow.
# Requires a Windows self-hosted runner with Visual Studio/MSBuild and
# the PS5 Prospero SDK installed. GitHub-hosted runners lack that SDK.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playgo-log-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-log:
    name: Build ReleaseLog SPRX
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Python for project build helpers
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build PS5 ReleaseLog
        shell: pwsh
        run: |
          msbuild .\libScePlayGo.sln /m /p:Configuration=ReleaseLog /p:Platform=Prospero /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify generated SPRX
        shell: pwsh
        run: |
          $sprx = 'out/log/libScePlayGo.sprx'
          if (-not (Test-Path -LiteralPath $sprx -PathType Leaf)) {
            throw "Build completed without expected output: $sprx"
          }
          Get-Item -LiteralPath $sprx | Select-Object FullName, Length
          Get-FileHash -LiteralPath $sprx -Algorithm SHA256

      - name: Upload logging SPRX
        uses: actions/upload-artifact@v4
        with:
          name: libScePlayGo-0.6-ReleaseLog
          path: out/log/libScePlayGo.sprx
          if-no-files-found: error
          retention-days: 14
